<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 240">
<!-- force channel (solid, thin parallel rails — unbroken momentum) -->
<line fill="none" stroke="#ffb86c" stroke-width="1.5" stroke-linecap="round" x1="26" y1="55" x2="26" y2="200"/>
<line fill="none" stroke="#ffb86c" stroke-width="1.5" stroke-linecap="round" x1="32" y1="55" x2="32" y2="200"/>
<!-- Initiation: origin + first thrust -->
<line fill="none" stroke="#ffb86c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" x1="18" y1="48" x2="58" y2="48"/>
<polyline fill="none" stroke="#ffb86c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="50,34 74,48 50,62"/>
<circle fill="#0a0512" stroke="#ffb86c" stroke-width="2" cx="22" cy="48" r="7"/>
<!-- Stabilization: dual rails + chevrons + filled core -->
<line fill="none" stroke="#ffb86c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" x1="18" y1="116" x2="64" y2="116"/>
<line fill="none" stroke="#ffb86c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" x1="18" y1="144" x2="64" y2="144"/>
<polyline fill="none" stroke="#ffb86c" stroke-width="1.5" stroke-linecap="round" points="56,106 74,116 56,126"/>
<polyline fill="none" stroke="#ffb86c" stroke-width="1.5" stroke-linecap="round" points="56,134 74,144 56,154"/>
<circle fill="#ffb86c" stroke="none" cx="40" cy="130" r="9"/>
<!-- Resolution: residual tip + echo -->
<line fill="none" stroke="#ffb86c" stroke-width="1.5" stroke-linecap="round" x1="22" y1="205" x2="54" y2="205"/>
<polyline fill="none" stroke="#ffb86c" stroke-width="1.5" stroke-linecap="round" points="46,197 60,205 46,213"/>
<circle fill="none" stroke="#ffb86c" stroke-width="2" stroke-dasharray="3 3" cx="50" cy="205" r="6.5"/>
</svg>
