<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 240">
<!-- wake ribbon (two solid curved guides — the pull that never breaks) -->
<path fill="none" stroke="#ffb86c" stroke-width="1.5" stroke-linecap="round" d="M30,55 Q34,100 30,145 Q26,175 30,200"/>
<path fill="none" stroke="#ffb86c" stroke-width="1.5" stroke-linecap="round" d="M38,55 Q42,100 38,145 Q34,175 38,200"/>
<!-- Initiation: lead + opening wake arcs -->
<circle fill="#0a0512" stroke="#ffb86c" stroke-width="2" cx="26" cy="48" r="7"/>
<path fill="none" stroke="#ffb86c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M34,34 Q56,24 78,34"/>
<path fill="none" stroke="#ffb86c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M34,62 Q56,72 78,62"/>
<line fill="none" stroke="#ffb86c" stroke-width="1.5" stroke-linecap="round" x1="34" y1="48" x2="70" y2="48"/>
<!-- Stabilization: lead + three followers bound into the ribbon -->
<circle fill="#ffb86c" stroke="none" cx="24" cy="130" r="9"/>
<circle fill="none" stroke="#ffb86c" stroke-width="1.5" stroke-linecap="round" cx="50" cy="114" r="5"/>
<circle fill="none" stroke="#ffb86c" stroke-width="1.5" stroke-linecap="round" cx="50" cy="146" r="5"/>
<circle fill="none" stroke="#ffb86c" stroke-width="1.5" stroke-linecap="round" cx="76" cy="130" r="5"/>
<line fill="none" stroke="#ffb86c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" x1="32" y1="126" x2="44" y2="116"/>
<line fill="none" stroke="#ffb86c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" x1="32" y1="134" x2="44" y2="144"/>
<line fill="none" stroke="#ffb86c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" x1="56" y1="118" x2="70" y2="126"/>
<line fill="none" stroke="#ffb86c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" x1="56" y1="142" x2="70" y2="134"/>
<!-- Resolution: residual lead + dissolved wake -->
<circle fill="none" stroke="#ffb86c" stroke-width="2" stroke-dasharray="3 3" cx="28" cy="205" r="6.5"/>
<path fill="none" stroke="#ffb86c" stroke-width="1.5" stroke-linecap="round" d="M38,193 Q56,186 76,194"/>
<path fill="none" stroke="#ffb86c" stroke-width="1.5" stroke-linecap="round" d="M38,217 Q56,224 76,216"/>
<circle fill="none" stroke="#ffb86c" stroke-width="1.5" stroke-linecap="round" cx="62" cy="205" r="4"/>
</svg>
