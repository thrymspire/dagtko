<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 240">
<!-- hinge post (solid — the fulcrum is continuous and load-bearing) -->
<line fill="none" stroke="#ffb86c" stroke-width="2.5" stroke-linecap="round" x1="50" y1="14" x2="50" y2="205"/>
<!-- Initiation: opening angle from the post -->
<line fill="none" stroke="#ffb86c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" x1="50" y1="48" x2="80" y2="26"/>
<line fill="none" stroke="#ffb86c" stroke-width="1.5" stroke-linecap="round" x1="50" y1="48" x2="76" y2="60"/>
<circle fill="#0a0512" stroke="#ffb86c" stroke-width="2" cx="50" cy="48" r="7"/>
<!-- Stabilization: crossed load arms through the post -->
<line fill="none" stroke="#ffb86c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" x1="22" y1="106" x2="78" y2="154"/>
<line fill="none" stroke="#ffb86c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" x1="22" y1="154" x2="78" y2="106"/>
<circle fill="#ffb86c" stroke="none" cx="50" cy="130" r="9"/>
<!-- Resolution: settled orientation locked to the post -->
<line fill="none" stroke="#ffb86c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" x1="26" y1="205" x2="74" y2="205"/>
<path fill="none" stroke="#ffb86c" stroke-width="1.5" stroke-linecap="round" d="M30,222 A26,26 0 0,1 70,222"/>
<circle fill="none" stroke="#ffb86c" stroke-width="2" stroke-dasharray="3 3" cx="50" cy="205" r="6.5"/>
</svg>
