<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<style>
.ln { fill:none; stroke:#ff79c6; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
.ln-thin { fill:none; stroke:#ff79c6; stroke-width:1.5; stroke-linecap:round; }
.dot-open { fill:#0a0512; stroke:#ff79c6; stroke-width:2; }
.dot-fill { fill:#ff79c6; stroke:none; }
.dot-echo { fill:none; stroke:#ff79c6; stroke-width:2; stroke-dasharray:3 3; }
.spine-reinforced { stroke:#9d5cff; stroke-width:3; stroke-linecap:round; }
.spine-crack { stroke:#ff79c6; stroke-width:2.5; }
.spine-faint { stroke:rgba(95,251,241,0.6); stroke-width:1.5; stroke-dasharray:2 2; }
</style>
<line class="ln" x1="32" x2="32" y1="16" y2="86"/>
<line class="ln" x1="50" x2="50" y1="16" y2="86"/>
<line class="ln" x1="68" x2="68" y1="16" y2="86"/>
<line class="ln" x1="21" x2="79" y1="79" y2="21"/>
<circle class="dot-fill" cx="50" cy="50" r="5.5"/>
</svg>